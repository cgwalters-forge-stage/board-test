# Runs the scripted agent on one task: an issue of this repository, or
# the container report. The script that stands in for a model is
# .github/agentic-job/tasks/ITEM.sh.
name: task
run-name: task ${{ inputs.item }}
on:
  workflow_dispatch:
    inputs:
      item:
        description: issue-N for an issue of this repository, or container
        type: string
        required: true
permissions: {}
jobs:
  run:
    concurrency:
      group: agent-${{ inputs.item }}
    uses: cgwalters-forge/agentic-job/.github/workflows/agentic-job.yml@45efe1233ce2ba8300318cb71fe6b866953972b6
    permissions:
      id-token: write
      contents: write
      issues: write
      pull-requests: write
    with:
      id: ${{ inputs.item }}
      task: Do what the item ${{ inputs.item }} of this repository asks, and propose the change as a pull request that closes it.
      repo: ${{ github.repository }}
      outputs: create_pull_request,add_comment,noop
      allow: .github/agentic-job/allow.toml
      config: .github/agentic-job/hosted.toml
      agent: fake
      setup: .github/agentic-job/tasks/${{ inputs.item }}.sh
      timeout: "15"
      budget: "100"
      max-requests: "0"
      refused-pull-request: branch
