# A real agent: the README's call with the lines example.yml gives for
# claude, reaching the inference proxy over the tailnet.
name: real
run-name: real agent ${{ inputs.item }}
on:
  workflow_dispatch:
    inputs:
      item:
        type: string
        default: real
      task:
        type: string
        required: true
      npm:
        description: The agent's programs, NAME@VERSION
        type: string
        default: ""
permissions: {}
jobs:
  run:
    concurrency:
      group: agent-${{ inputs.item }}
    uses: cgwalters-forge/agentic-job/.github/workflows/agentic-job.yml@01a508f539c1cecd81773f94c06c34061a9fe466
    permissions:
      id-token: write
      contents: write
      issues: write
      pull-requests: write
    with:
      id: ${{ inputs.item }}
      task: ${{ inputs.task }}
      repo: ${{ github.repository }}
      outputs: create_pull_request,noop
      allow: .github/agentic-job/allow.toml
      config: .github/agentic-job/hosted.toml
      agent: claude
      npm: ${{ inputs.npm }}
      inference-url: ${{ vars.INFERENCE_URL }}
      inference-audience: ${{ vars.INFERENCE_AUDIENCE }}
      # The proxy is on a tailnet: the agent's runner joins it with the
      # job's identity token (organization variables, as in bootc-dev).
      tailscale-oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
      tailscale-audience: ${{ vars.TS_AUDIENCE }}
      tailscale-tags: tag:bootc-dev-sandbox
      max-requests: "150"
      timeout: "10"
      refused-pull-request: branch
