# Bounds for board repairs: agent-board's proposals, applied to project 2.
hosts = ["github.com"]
repos = ["cgwalters-forge-stage/board-test"]
bases = ["main"]
max_outputs = 3
max_patch_bytes = 1024
max_patch_files = 1

[outputs]
noop = { max = 1 }

[outputs.update_project]
max = 3
projects = ["https://github.com/orgs/cgwalters-forge-stage/projects/2"]
fields = ["Status", "Turn", "Run", "Result"]
